name: CineCast
options:
  bundleIdPrefix: com.cinecast
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_NAME: "极光视界"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "14"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SUPPORTS_MACCATALYST: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CineCast:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CineCast
    settings:
      base:
        INFOPLIST_FILE: CineCast/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cinecast.ios
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
schemes:
  CineCast:
    build:
      targets:
        CineCast: all
    run:
      config: Debug
    archive:
      config: Release
